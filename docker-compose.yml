name: ground

# ---------------------------------------------------------------------------
# Local development environment for the "ground" theme.
# The theme repo is mounted into a WordPress provided by the containers.
# Start: `npm run docker:up`  →  http://localhost:8080  (mail at http://localhost:8025)
# ---------------------------------------------------------------------------

# Dev PHP constants, evaluated at runtime by wp-config (eval). Defined once and
# shared by wordpress (web) and wpcli (CLI) so they are identical everywhere.
x-wp-config-extra: &wp_config_extra |
  define( 'WP_HOME', '${WP_URL}' );
  define( 'WP_SITEURL', '${WP_URL}' );
  define( 'WP_DEBUG_LOG', true );
  define( 'WP_DEBUG_DISPLAY', true );
  define( 'WP_MEMORY_LIMIT', '256M' );
  define( 'WP_MAX_MEMORY_LIMIT', '256M' );
  define( 'WP_ENVIRONMENT_TYPE', 'local' );
  define( 'WPLANG', '${WP_LOCALE:-it_IT}' );
  define( 'DISALLOW_FILE_EDIT', true );
  define( 'SAVEQUERIES', true );
  define( 'WP_DISABLE_FATAL_ERROR_HANDLER', true );

services:
  db:
    image: mariadb:11
    restart: "no"
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Any .sql here is imported on the FIRST start (empty volume).
      - ./.docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: *wp_config_extra
    volumes:
      - wp_core:/var/www/html
      # The theme repo, mounted for hot-reload:
      - ./:/var/www/html/wp-content/themes/ground
      # Route all outgoing mail to Mailpit (dev only):
      - ./.docker/mu-plugins/mailpit-dev.php:/var/www/html/wp-content/mu-plugins/mailpit-dev.php

  # WP-CLI: used by the npm scripts (docker:provision, docker:wp).
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      # Writable HOME for the WP-CLI cache (the container runs as uid 33).
      HOME: /tmp
      # Must match the wordpress service: wp-config reads them at runtime.
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WORDPRESS_CONFIG_EXTRA: *wp_config_extra
      WP_URL: ${WP_URL}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      # Site locale: same value as WPLANG above; provision.sh installs and keeps
      # updated the language packs for core, plugins and themes.
      WP_LOCALE: ${WP_LOCALE:-it_IT}
      # Feature toggles (in .env): which optional plugins provision.sh installs.
      ENABLE_WOOCOMMERCE: ${ENABLE_WOOCOMMERCE:-true}
      ENABLE_WPML: ${ENABLE_WPML:-false}
      # Seed demo content (in .env): provision.sh imports fixtures + WP test data.
      ENABLE_SEED: ${ENABLE_SEED:-false}
      # Premium plugin licenses (in .env). NB: values containing "$" (WPML
      # subscription key) must be wrapped in SINGLE QUOTES in .env so Compose
      # does not interpolate them.
      ACF_PRO_KEY: ${ACF_PRO_KEY:-}
      WPML_USER_ID: ${WPML_USER_ID:-}
      WPML_SUBSCRIPTION_KEY: ${WPML_SUBSCRIPTION_KEY:-}
    volumes:
      - wp_core:/var/www/html
      - ./:/var/www/html/wp-content/themes/ground
      - ./.docker/plugins:/plugins:ro
      - ./.docker:/docker-scripts:ro

  mailpit:
    image: axllent/mailpit:latest
    restart: "no"
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db_data:
  wp_core:
